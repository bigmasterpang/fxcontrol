# Nginx Reverse Proxy configuration for Phicomm FX Control
server {
    listen 80;
    server_name your_domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your_domain.com;

    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;

    # Static Web App (FX UI)
    location = /fx {
        return 301 /fx/;
    }

    location /fx/ {
        alias /var/www/html/fx/;
        index index.html;
        try_files $uri $uri/ /fx/index.html;
    }

    # RESTful API Reverse Proxy to Waitress/Flask backend
    location /fx/api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
