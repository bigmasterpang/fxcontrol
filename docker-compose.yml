version: '3.8'

services:
  fxcontrol:
    build:
      context: .
      args:
        - MQTT_PUBLIC_HOST=${MQTT_PUBLIC_HOST:-}
        - MQTT_PUBLIC_PORT=${MQTT_PUBLIC_PORT:-1883}
        - MQTT_USER=${MQTT_USER:-}
        - MQTT_PASS=${MQTT_PASS:-}
    container_name: fxcontrol-app
    restart: always
    ports:
      - "${PORT:-8089}:8089"
    environment:
      - HOST=0.0.0.0
      - PORT=8089
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:-fxcontrol_secure_token_key_2026}
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_PUBLIC_HOST=${MQTT_PUBLIC_HOST:-}
      - MQTT_PUBLIC_PORT=${MQTT_PUBLIC_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - DB_PATH=/app/data/fx.db
      - FX_ADMIN_USER=${FX_ADMIN_USER:-admin}
      - FX_ADMIN_PASS=${FX_ADMIN_PASS:-admin123}
      - ADMIN_DEFAULT_PASSWORD=${FX_ADMIN_PASS:-admin123}
    volumes:
      - ./data:/app/data
      - ./server:/app/server
      - mosquitto_log:/var/log/mosquitto:ro
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fxcontrol-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deploy/mosquitto/mqtt.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
